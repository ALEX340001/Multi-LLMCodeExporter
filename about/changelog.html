<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История изменений — Multi‑LLMCodeExporter</title>
    <base href="/Multi-LLMCodeExporter/">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/clock.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="google_translate_element" style="display:none;"></div>
    <div class="nav-wrapper"></div>
    <main>
        <div id="clocks-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></div>
        <div class="container">
            <div class="page-content">
                <h1 class="page-title">История изменений</h1>
                <div class="project-card" id="changelog-content" style="color: var(--text-secondary); line-height: 1.6;">
                    Загрузка...
                </div>
            </div>
        </div>
    </main>
    <script src="../index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('changelog-content');
            fetch('/Multi-LLMCodeExporter/about/changelog.md')
                .then(response => {
                    if (!response.ok) throw new Error('Не удалось загрузить changelog.md');
                    return response.text();
                })
                .then(markdown => {
                    container.innerHTML = marked.parse(markdown);
                })
                .catch(error => {
                    container.innerHTML = '<p style="color: var(--text-secondary);">❌ Ошибка загрузки истории изменений.</p>';
                    console.error(error);
                });
        });
    </script>
</body>
</html>
